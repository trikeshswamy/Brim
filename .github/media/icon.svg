<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <title>Brim app icon</title>
  <!-- Final · Peek in the dark: the island hangs from the top edge, black on near-black, barely there; two amber eyes
       glow in it. You see the eyes first, then the island. -->
  <defs>
    <radialGradient id="room" cx="0.5" cy="1.0" r="1.05">
      <stop offset="0" stop-color="#3a2717"/><stop offset="0.5" stop-color="#140e0a"/><stop offset="1" stop-color="#050404"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c" stop-opacity="0"/><stop offset="1" stop-color="#ffb35c" stop-opacity="0.28"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="57"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#room)"/>
    <path d="M52 -2 H204 V70 A46 46 0 0 1 158 116 H98 A46 46 0 0 1 52 70 Z" fill="#000" stroke="url(#rim)" stroke-width="1.4"/>
    <ellipse cx="108" cy="66" rx="14" ry="19" fill="#ffb35c"/>
    <ellipse cx="148" cy="66" rx="14" ry="19" fill="#ffb35c"/>
  </g>
</svg>
